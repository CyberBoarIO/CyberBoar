  - {name: "git show HEAD:.env", policy: baseline, action: {command: "git show HEAD:.env"}, expect: {decision: deny}}
  - {name: "git diff --no-index /dev/null .env", policy: baseline, action: {command: "git diff --no-index /dev/null .env"}, expect: {decision: deny}}
