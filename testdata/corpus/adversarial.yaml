  - {name: "env -a takes a value", policy: baseline, action: {command: "env -a x terraform apply"}, expect: {decision: deny, rule: "commands.deny[0]"}}
  - {name: "sudo --us", policy: baseline, action: {command: "sudo --us root terraform apply"}, expect: {decision: deny, rule: "commands.deny[0]"}}
  - {name: "command time --out", policy: baseline, action: {command: "command time --out f terraform apply"}, expect: {decision: deny, rule: "commands.deny[0]"}}
  - {name: "flock --wai", policy: baseline, action: {command: "flock --wai 5 f terraform apply"}, expect: {decision: deny, rule: "commands.deny[0]"}}
  - {name: "setpriv --reset-env takes no value", policy: baseline, action: {command: "setpriv --reset-env terraform apply"}, expect: {decision: deny, rule: "commands.deny[0]"}}
  - {name: "git rebase --exe", policy: baseline, action: {command: "git rebase --exe 'terraform apply' HEAD~1"}, expect: {decision: deny, rule: "commands.deny[0]"}}
  - {name: "git config --fil", policy: baseline, action: {command: "git config --fil x core.pager 'terraform apply'"}, expect: {decision: deny}}
  - {name: "tar --to-comm", policy: baseline, action: {command: "tar -xf a.tar --to-comm 'terraform apply'"}, expect: {decision: deny, rule: "commands.deny[0]"}}
  - {name: "ncat --sh", policy: baseline, action: {command: "ncat --sh 'terraform apply' x 1"}, expect: {decision: deny, rule: "commands.deny[0]"}}
  - {name: "nano --spell", policy: baseline, action: {command: "nano --spell 'terraform apply' f"}, expect: {decision: deny, rule: "commands.deny[0]"}}
  - {name: "ansible --ar", policy: baseline, action: {command: "ansible all --ar 'terraform apply'"}, expect: {decision: deny, rule: "commands.deny[0]"}}
  - {name: "ansible -aARGS", policy: baseline, action: {command: "ansible all -a'terraform apply'"}, expect: {decision: deny, rule: "commands.deny[0]"}}
  - {name: "make --ev", policy: baseline, action: {command: "make --ev 'x:'"}, expect: {decision: deny, rule: commands.denyInterpreters}}
  - {name: "gdb -eval", policy: baseline, action: {command: "gdb -batch -eval 'shell terraform apply'"}, expect: {decision: deny, rule: commands.denyInterpreters}}
  - {name: "emacs --ev", policy: baseline, action: {command: "emacs --batch --ev '(x)'"}, expect: {decision: deny, rule: commands.denyInterpreters}}
  - {name: "puppet apply --exec", policy: baseline, action: {command: "puppet apply --exec 'x'"}, expect: {decision: deny, rule: commands.denyInterpreters}}

  # Optional arguments are the rest of the word, never the next one: in
  # sed -if, f is the backup suffix and the script follows
  - {name: "sed -if takes f as the suffix", policy: baseline, action: {command: "sed -if 'sXechoXechoXe' README.md"}, expect: {decision: deny, rule: commands.denyInterpreters}}
  - {name: "xargs -ed", policy: baseline, action: {command: "xargs -ed terraform apply"}, expect: {decision: deny, rule: "commands.deny[0]"}}
  - {name: "xargs --eof takes no next word", policy: baseline, action: {command: "xargs --eof terraform apply"}, expect: {decision: deny, rule: "commands.deny[0]"}}
  - {name: "awk -pf", policy: baseline, action: {command: "awk -pf 'BEGIN{system(\"x\")}'"}, expect: {decision: deny, rule: commands.denyInterpreters}}
  - {name: "make -j takes no next word", policy: baseline, action: {command: "make -j --eval 'x:'"}, expect: {decision: deny, rule: commands.denyInterpreters}}
  - {name: "make -L takes no value", policy: baseline, action: {command: "make -L --eval 'x:'"}, expect: {decision: deny, rule: commands.denyInterpreters}}
  - {name: "awk -Z takes a value", policy: baseline, action: {command: "awk -Z C 'BEGIN{system(\"x\")}'"}, expect: {decision: deny, rule: commands.denyInterpreters}}

  # Quoted expansions that can be no word at all, like "$@"
  - {name: "\"${!prefix@}\" before a denied command", policy: baseline, action: {command: "\"${!NOSUCH@}\" terraform apply"}, expect: {decision: ask, rule: "commands.deny[0]"}}
  - {name: "\"${!x}\" with x=@", policy: baseline, action: {command: "x=@; \"${!x}\" terraform apply"}, expect: {decision: ask, rule: "commands.deny[0]"}}
