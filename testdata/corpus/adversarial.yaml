  # --- Case and Unicode spellings (macOS) ------------------------------------------
  # macOS filesystems ignore case by default (APFS, HFS+), so PATH lookup finds
  # /bin/sh for "SH"; HFS+ also ignores zero-width characters in names (git's
  # CVE-2014-9390), and APFS ignores Unicode normalization. Programs looked up on
  # disk are matched folded; shell builtins (cd, eval, …) stay exact, since
  # "CD" is not the builtin.
  - {name: "SH -c 'cat .env'", policy: baseline, action: {command: "SH -c 'cat .env'"}, expect: {decision: deny}}
  - {name: "Bash -c 'terraform apply'", policy: baseline, action: {command: "Bash -c 'terraform apply'"}, expect: {decision: deny}}
  - {name: "/BIN/SH -c 'cat .env'", policy: baseline, action: {command: "/BIN/SH -c 'cat .env'"}, expect: {decision: deny}}
  - {name: "sudo SH -c 'cat .env'", policy: baseline, action: {command: "sudo SH -c 'cat .env'"}, expect: {decision: deny}}
  - {name: "SUDO terraform apply", policy: baseline, action: {command: "SUDO terraform apply"}, expect: {decision: deny}}
  - {name: "ENV sh -c 'cat .env'", policy: baseline, action: {command: "ENV sh -c 'cat .env'"}, expect: {decision: deny}}
  - {name: "XARGS terraform apply", policy: baseline, action: {command: "echo x | XARGS terraform apply"}, expect: {decision: deny}}
  - {name: "PYTHON3 -c 'print(1)'", policy: baseline, action: {command: "PYTHON3 -c 'print(1)'"}, expect: {decision: deny, rule: commands.denyInterpreters}}
  - {name: "Python3.12 -c 'print(1)'", policy: baseline, action: {command: "Python3.12 -c 'print(1)'"}, expect: {decision: deny, rule: commands.denyInterpreters}}
  - {name: "NODE -e 1", policy: baseline, action: {command: "NODE -e 1"}, expect: {decision: deny, rule: commands.denyInterpreters}}
  - {name: "rscript -e 1", policy: baseline, action: {command: "rscript -e 1"}, expect: {decision: deny, rule: commands.denyInterpreters}}
  - {name: "SSH -o ProxyCommand='cat .env' x", policy: baseline, action: {command: "SSH -o ProxyCommand='cat .env' x"}, expect: {decision: deny}}
  - {name: "zero-width joiner in sh", policy: baseline, action: {command: "s\u200Dh -c 'cat .env'"}, expect: {decision: deny}}
  - {name: "zero-width non-joiner in a file name", policy: baseline, action: {command: "cat .e\u200Cnv"}, expect: {decision: deny, rule: "files.deny[0]"}}
  - {name: "byte order mark in a directory name", policy: baseline, action: {command: "cat ~/.ssh\uFEFF/id_rsa"}, expect: {decision: deny, rule: "files.deny[2]"}}
  - {name: "long s folds to s", policy: baseline, action: {command: "cat ~/.\u017Fsh/id_rsa"}, expect: {decision: deny, rule: "files.deny[2]"}}
  - {name: "zero-width space inside a denied command", policy: baseline, action: {command: "terr\u200Baform apply"}, expect: {decision: deny, rule: "commands.deny[0]"}}
  - {name: "anywhere rule with a zero-width character in an unknown directory", policy: baseline, action: {command: "cd \"$D\" && cat x/.E\u200Cnv"}, expect: {decision: deny, rule: "files.deny[0]"}}

  # $'…' escapes that shells read differently (found by the mutated bash
  # differential): bash 4.2+ reads \x{HH}, \cX and \uHHHH, older bash and zsh
  # don't, and a NUL ends the string in bash only. A word with one is only
  # known at run time
  # The portable escapes are still decoded
  - {name: "bash-only \\x{..} spells a denied command", policy: baseline, action: {command: "$'\\x{74}erraform' apply"}, expect: {decision: ask}}
  - {name: "\\u escape spells a denied command", policy: baseline, action: {command: "$'\\u0074erraform' apply"}, expect: {decision: ask}}
  - {name: "control escape inside a denied command", policy: baseline, action: {command: "terraform$'\\c@x' apply"}, expect: {decision: ask}}
  - {name: "\\x{..} spells a protected file", policy: baseline, action: {command: "cat $'\\x{2e}env'"}, expect: {decision: ask}}
  - {name: "octal escapes spell a denied command", policy: baseline, action: {command: "$'\\164erraform' apply"}, expect: {decision: deny, rule: "commands.deny[0]"}}
  - {name: "hex and octal escapes spell a protected file", policy: baseline, action: {command: "cat $'\\x2e\\145nv'"}, expect: {decision: deny, rule: "files.deny[0]"}}
  - {name: "HOME spelled with an octal escape", policy: baseline, action: {command: "export $'\\110OME'={{root}}/home/dev/.ssh; cat ~/id_rsa"}, expect: {decision: ask}}
  - {name: "HOME spelled with a hex escape in declare", policy: baseline, action: {command: "declare $'\\x48OME={{root}}/home/dev/.ssh'; cat ~/id_rsa"}, expect: {decision: ask}}
  - {name: "HOME spelled with a \\u escape", policy: baseline, action: {command: "export $'\\u0048OME'={{root}}/home/dev/.ssh; cat ~/id_rsa"}, expect: {decision: ask}}
  - {name: "HOME split by quotes in export", policy: baseline, action: {command: "export HO\"\"ME={{root}}/home/dev/.ssh; cat ~/id_rsa"}, expect: {decision: ask}}
  - {name: "CDPATH spelled with escapes", policy: baseline, action: {command: "export $'\\x43DPATH'=~; cd .ssh && cat id_rsa"}, expect: {decision: ask}}
  - {name: "NUL at the end of a word", policy: baseline, action: {command: "cat ~/.aws/credentials$'\\x00junk'"}, expect: {decision: deny, rule: "files.deny[3]"}}
  - {name: "NUL inside a word", policy: baseline, action: {command: "cat ~/.aws/cred$'\\0'entials"}, expect: {decision: ask}}

  # Long options cut short: getopt_long, git's parse-options, argparse and
  # Emacs take any unambiguous prefix (--sig for --signal), so the option
  # still takes its value and the command after it is the one that runs
  - {name: "timeout --sig", policy: baseline, action: {command: "timeout --sig KILL 5 terraform apply"}, expect: {decision: deny, rule: "commands.deny[0]"}}
  - {name: "nice --adj", policy: baseline, action: {command: "nice --adj 5 terraform apply"}, expect: {decision: deny, rule: "commands.deny[0]"}}
