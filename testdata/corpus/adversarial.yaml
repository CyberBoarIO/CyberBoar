  - {name: "tar czf - . | cat", policy: baseline, action: {command: "tar czf - . | cat"}, expect: {decision: deny}}
  - {name: "zip -r /tmp/x.zip .", policy: baseline, action: {command: "zip -r /tmp/x.zip ."}, expect: {decision: deny}}
  - {name: "find . -name .env -exec cat {} +", policy: baseline, action: {command: "find . -name .env -exec cat {} +"}, expect: {decision: deny}}
  - {name: "find . -exec cat {} \\; -exec true {} \\;", policy: baseline, action: {command: "find . -exec cat {} \\; -exec true {} \\;"}, expect: {decision: deny}}
  - {name: "find . -exec cat {} \\; -exec ls {} \\;", policy: baseline, action: {command: "find . -exec cat {} \\; -exec ls {} \\;"}, expect: {decision: deny}}
  - {name: "dd if=.env", policy: baseline, action: {command: "dd if=.env"}, expect: {decision: deny}}
  - {name: "base64 .env", policy: baseline, action: {command: "base64 .env"}, expect: {decision: deny}}
  - {name: "cat /proc/self/cwd/.env", policy: baseline, action: {command: "cat /proc/self/cwd/.env"}, expect: {decision: deny}}
  - {name: "cat /dev/fd/3 3<.env", policy: baseline, action: {command: "cat /dev/fd/3 3<.env"}, expect: {decision: deny}}
  - {name: "cat .ENV", policy: baseline, action: {command: "cat .ENV"}, expect: {decision: deny}}
  - {name: "cat ~/.ssh/*", policy: baseline, action: {command: "cat ~/.ssh/*"}, expect: {decision: deny}}
  - {name: "cp -r ~/.ssh /tmp/x", policy: baseline, action: {command: "cp -r ~/.ssh /tmp/x"}, expect: {decision: deny}}
  - {name: "rsync -a ~/.ssh/ /tmp/x", policy: baseline, action: {command: "rsync -a ~/.ssh/ /tmp/x"}, expect: {decision: deny}}
  - {name: "cd ~/.s* && cat id_rsa", policy: baseline, action: {command: "cd ~/.s* && cat id_rsa"}, expect: {decision: deny}}
  - {name: "pushd ~/.ssh && cat id_rsa", policy: baseline, action: {command: "pushd ~/.ssh && cat id_rsa"}, expect: {decision: deny}}
