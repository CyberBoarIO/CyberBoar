  - {name: "cat \"${HOME}/.ssh/id_rsa\"", policy: baseline, action: {command: "cat \"${HOME}/.ssh/id_rsa\""}, expect: {decision: deny}}
  - {name: "cat ${HOME:-/x}/.ssh/id_rsa", policy: baseline, action: {command: "cat ${HOME:-/x}/.ssh/id_rsa"}, expect: {decision: ask}}
  - {name: "cat $HOME/.ssh/id_rsa", policy: baseline, action: {command: "cat $HOME/.ssh/id_rsa"}, expect: {decision: deny}}
