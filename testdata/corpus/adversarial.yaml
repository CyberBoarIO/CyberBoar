  - {name: "openssl enc -in .env", policy: baseline, action: {command: "openssl enc -in .env"}, expect: {decision: deny}}
  - {name: "gpg -c .env", policy: baseline, action: {command: "gpg -c .env"}, expect: {decision: deny}}
  - {name: "tee /dev/null < .env", policy: baseline, action: {command: "tee /dev/null < .env"}, expect: {decision: deny}}
