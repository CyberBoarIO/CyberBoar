  - {name: "cat .env/", policy: baseline, action: {command: "cat .env/"}, expect: {decision: deny}}
  - {name: "truncate -s 0 .env", policy: baseline, action: {command: "truncate -s 0 .env"}, expect: {decision: deny}}
