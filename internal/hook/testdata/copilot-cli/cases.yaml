  - {name: "VS Code: an ask rule asks", policy: baseline, input: {hook_event_name: PreToolUse, session_id: v1, tool_use_id: "c", tool_name: run_in_terminal, tool_input: {command: "cd {{root}}/proj && git push origin main", explanation: x, goal: x, mode: sync}}, expect: {decision: ask, rule: "commands.ask[0]"}}
  - {name: "VS Code: a command that is not a string", policy: baseline, input: {hook_event_name: PreToolUse, session_id: v1, tool_use_id: "c", tool_name: run_in_terminal, tool_input: {command: ["ls"], explanation: x, goal: x, mode: sync}}, expect: {decision: deny, rule: error.invalidInput}}
  - {name: "VS Code: typing into a terminal is blocked", policy: baseline, input: {hook_event_name: PreToolUse, session_id: v1, tool_use_id: "c", tool_name: send_to_terminal, tool_input: {id: "12345678-1234-4123-8123-123456789012", command: "cat .env"}}, expect: {decision: deny, rule: adapter.uncheckedTool}}
  - {name: "VS Code: reading terminal output touches nothing", policy: baseline, input: {hook_event_name: PreToolUse, session_id: v1, tool_use_id: "c", tool_name: terminal_last_command, tool_input: {}}, expect: {decision: none}}
  - {name: "VS Code: a task runs its command in the workspace folder", policy: baseline, input: {hook_event_name: PreToolUse, session_id: v1, tool_use_id: "c", tool_name: create_and_run_task, tool_input: {workspaceFolder: "{{root}}/proj", task: {label: hello, type: shell, command: "cat", args: ["src/main.go"]}}}, expect: {decision: none}}
  - {name: "VS Code: a task reading a secret", policy: baseline, input: {hook_event_name: PreToolUse, session_id: v1, tool_use_id: "c", tool_name: create_and_run_task, tool_input: {workspaceFolder: "{{root}}/proj", task: {label: x, type: shell, command: "cat", args: [".env"]}}}, expect: {decision: deny, rule: "files.deny[0]"}}
  - {name: "VS Code: a task in another directory", policy: baseline, input: {hook_event_name: PreToolUse, session_id: v1, tool_use_id: "c", tool_name: create_and_run_task, tool_input: {workspaceFolder: "{{root}}/proj", task: {label: x, type: shell, command: "cat id_rsa", options: {cwd: "{{root}}/home/.ssh"}}}}, expect: {decision: deny, rule: "files.deny[2]"}}
  - {name: "VS Code: a task that isn't a shell task", policy: baseline, input: {hook_event_name: PreToolUse, session_id: v1, tool_use_id: "c", tool_name: create_and_run_task, tool_input: {workspaceFolder: "{{root}}/proj", task: {label: x, type: npm, script: build}}}, expect: {decision: deny, rule: error.invalidInput}}
  # Refuse task properties that change what runs or where and VS Code's ${…} variables
  - {name: "VS Code: a task's environment", policy: baseline, input: {hook_event_name: PreToolUse, session_id: v1, tool_use_id: "c", tool_name: create_and_run_task, tool_input: {workspaceFolder: "{{root}}/proj", task: {label: x, type: shell, command: "ls", options: {env: {BASH_ENV: "{{root}}/proj/.env"}}}}}, expect: {decision: deny, rule: error.invalidInput, reasonContains: "options.env"}}
  - {name: "VS Code: a task's command for one platform", policy: baseline, input: {hook_event_name: PreToolUse, session_id: v1, tool_use_id: "c", tool_name: create_and_run_task, tool_input: {workspaceFolder: "{{root}}/proj", task: {label: x, type: shell, command: "ls", linux: {command: "cat .env"}}}}, expect: {decision: deny, rule: error.invalidInput}}
