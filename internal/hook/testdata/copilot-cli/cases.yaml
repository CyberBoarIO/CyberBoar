          - {filePath: "{{root}}/proj/src/main.go", oldString: "a", newString: "b"}
          - {filePath: "{{root}}/proj/infra/terraform.tfstate", oldString: "a", newString: "b"}
    expect: {decision: ask, rule: "files.ask[0]"}
  - name: "VS Code: a replacement without a file"
    policy: baseline
    input: {hook_event_name: PreToolUse, session_id: v1, tool_use_id: c, tool_name: multi_replace_string_in_file, tool_input: {explanation: x, replacements: [{oldString: "a", newString: "b"}]}}
    expect: {decision: deny, rule: error.invalidInput}
  - {name: "VS Code: an edit sketch is checked for secrets", policy: baseline, input: {hook_event_name: PreToolUse, session_id: v1, tool_use_id: "c", tool_name: insert_edit_into_file, tool_input: {explanation: x, filePath: "{{root}}/proj/a.go", code: "// ...existing code...\nT={{fake:github-pat}}\n"}}, expect: {decision: deny, rule: secrets.github-pat}}
