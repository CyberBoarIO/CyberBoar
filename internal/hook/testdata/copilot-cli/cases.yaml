  - {name: "VS Code: a profile's user settings", policy: baseline, input: {hook_event_name: PreToolUse, session_id: v1, tool_use_id: "c", tool_name: create_file, tool_input: {filePath: "{{root}}/home/.config/Code/User/profiles/abc123/settings.json", content: "{}"}}, expect: {decision: deny, rule: builtin.guarded}}
  - {name: "VS Code: Codespaces machine settings", policy: baseline, input: {hook_event_name: PreToolUse, session_id: v1, tool_use_id: "c", tool_name: create_file, tool_input: {filePath: "{{root}}/home/.vscode-remote/data/Machine/settings.json", content: "{}"}}, expect: {decision: deny, rule: builtin.guarded}}
  - {name: "VS Code: other user data stays writable", policy: baseline, input: {hook_event_name: PreToolUse, session_id: v1, tool_use_id: "c", tool_name: create_file, tool_input: {filePath: "{{root}}/home/.config/Code/User/snippets/go.json", content: "{}"}}, expect: {decision: none}}
  - {name: "VS Code: Claude Code's hooks, which VS Code may run", policy: baseline, input: {hook_event_name: PreToolUse, session_id: v1, tool_use_id: "c", tool_name: create_file, tool_input: {filePath: "{{root}}/proj/.claude/settings.local.json", content: "{}"}}, expect: {decision: deny, rule: builtin.guarded}}

