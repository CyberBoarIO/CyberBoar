  - {name: "VS Code: creating a secret file", policy: baseline, input: {hook_event_name: PreToolUse, session_id: v1, tool_use_id: "c", tool_name: create_file, tool_input: {filePath: "{{root}}/proj/.env.prod", content: "X=1\n"}}, expect: {decision: deny, rule: "files.deny[0]"}}
