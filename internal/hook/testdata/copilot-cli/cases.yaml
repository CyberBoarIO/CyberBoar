  - {name: "Copilot CLI in a subfolder may not change that folder's settings", policy: baseline, input: {cwd: "{{root}}/proj/src", toolName: create, toolArgs: {path: "{{root}}/proj/src/.vscode/settings.json", file_text: "{}"}}, expect: {decision: deny, rule: builtin.guarded}}
  - {name: "VS Code: a subfolder of a work tree may not change the work tree's hooks", policy: baseline, input: {cwd: "{{root}}/repo/app", hook_event_name: PreToolUse, session_id: v1, tool_use_id: "c", tool_name: create_file, tool_input: {filePath: "{{root}}/repo/.github/hooks/x.json", content: "{}"}}, expect: {decision: deny, rule: builtin.guarded}}
  - {name: "VS Code: a subfolder of a work tree may not change the work tree's settings", policy: baseline, input: {cwd: "{{root}}/repo/app", hook_event_name: PreToolUse, session_id: v1, tool_use_id: "c", tool_name: create_file, tool_input: {filePath: "{{root}}/repo/.vscode/settings.json", content: "{}"}}, expect: {decision: deny, rule: builtin.guarded}}
