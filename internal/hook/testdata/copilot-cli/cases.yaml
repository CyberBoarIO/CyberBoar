  - {name: "Copilot CLI may not change VS Code's settings either", policy: baseline, input: {toolName: create, toolArgs: {path: "{{root}}/proj/.vscode/settings.json", file_text: "{}"}}, expect: {decision: deny, rule: builtin.guarded}}
