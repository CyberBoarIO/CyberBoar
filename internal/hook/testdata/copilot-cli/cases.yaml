  - {name: "VS Code: a personal agent from the terminal", policy: baseline, input: {hook_event_name: PreToolUse, session_id: v1, tool_use_id: "c", tool_name: run_in_terminal, tool_input: {command: "touch {{root}}/home/.copilot/agents/x.agent.md", explanation: x, goal: x, mode: sync}}, expect: {decision: deny, rule: builtin.guarded}}
