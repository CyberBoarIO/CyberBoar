  - {name: "VS Code: an MCP name with no tool part", policy: mcp-deny, input: {hook_event_name: PreToolUse, session_id: v1, tool_use_id: "c", tool_name: mcp_x, tool_input: {}}, expect: {decision: deny, rule: error.invalidInput}}

