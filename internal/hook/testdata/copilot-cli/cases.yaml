  - {name: "VS Code: a task running a VS Code command", policy: baseline, input: {hook_event_name: PreToolUse, session_id: v1, tool_use_id: "c", tool_name: create_and_run_task, tool_input: {workspaceFolder: "{{root}}/proj", task: {label: x, type: shell, command: "echo ${command:workbench.action.files.saveAll}"}}}, expect: {decision: deny, rule: error.invalidInput}}
  - {name: "VS Code: a task with the properties it may have", policy: baseline, input: {hook_event_name: PreToolUse, session_id: v1, tool_use_id: "c", tool_name: create_and_run_task, tool_input: {workspaceFolder: "{{root}}/proj", task: {label: build, type: shell, command: "go", args: ["build", "./..."], isBackground: false, problemMatcher: ["$go"], group: build, options: {cwd: "src"}}}}, expect: {decision: none}}
