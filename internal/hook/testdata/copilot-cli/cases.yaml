  - {name: "VS Code: a relative path may be anywhere", policy: baseline, input: {hook_event_name: PreToolUse, session_id: v1, tool_use_id: "c", tool_name: run_in_terminal, tool_input: {command: "cat main.go", explanation: x, goal: x, mode: sync}}, expect: {decision: ask, reasonContains: "cd /absolute/directory &&"}}
  - {name: "VS Code: an absolute cd makes paths checkable", policy: baseline, input: {hook_event_name: PreToolUse, session_id: v1, tool_use_id: "c", tool_name: run_in_terminal, tool_input: {command: "cd {{root}}/proj && cat src/main.go", explanation: x, goal: x, mode: sync}}, expect: {decision: none}}
