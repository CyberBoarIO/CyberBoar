# Generated by `cyberboar apply --agent codex --scope managed`; changes are overwritten.
allow_managed_hooks_only = true

[features]
hooks = true

[hooks]
managed_dir = "/usr/local/bin"

[[hooks.PreToolUse]]

[[hooks.PreToolUse.hooks]]
type = "command"
command = "'/usr/local/bin/cyberboar' hook --agent codex --policy '/etc/cyberboar/policy.yaml' --audit '/var/log/cyberboar/audit.jsonl' --deadline '5s'"
timeout = 10
statusMessage = "cyberboar: checking policy"

[[hooks.SessionStart]]

[[hooks.SessionStart.hooks]]
type = "command"
command = "'/usr/local/bin/cyberboar' brief --agent codex --policy '/etc/cyberboar/policy.yaml'"
timeout = 10
statusMessage = "cyberboar: briefing"

[rules]
prefix_rules = [
  { pattern = [{ token = "terraform" }, { token = "apply" }], decision = "forbidden", justification = "cyberboar policy baseline: terraform apply" },
  { pattern = [{ token = "kubectl" }, { token = "delete" }], decision = "forbidden", justification = "cyberboar policy baseline: kubectl delete" },
  { pattern = [{ token = "git" }, { token = "push" }], decision = "prompt", justification = "cyberboar policy baseline: git push" },
]

# notes:
# command pattern "curl | sh" (pipeline, quoting or wildcards) has no prefix_rule equivalent; only the hook enforces it
# prefix_rules match case-sensitively and only simple command chains; the hook covers the rest
# file rules, MCP rules, denyInterpreters and allow lists are enforced only by the hook
