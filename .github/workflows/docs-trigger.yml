# Start the docs site's build after a push to main or a published release
name: Docs trigger

on:
  push:
    branches: [main]
  release:
    types: [published]

permissions: {}

concurrency:
  group: docs-trigger-${{ github.ref }}
  cancel-in-progress: false

jobs:
  trigger:
    # Forks have no secrets to send
    if: github.repository == 'CyberBoarIO/CyberBoar'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    environment:
      name: cyberboar.dev
      url: https://cyberboar.dev
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start the docs build
        env:
          DOCS_TRIGGER: ${{ secrets.DOCS_TRIGGER }}
        run: scripts/trigger-docs.sh
