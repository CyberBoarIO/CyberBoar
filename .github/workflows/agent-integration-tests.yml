# Test CyberBoar hooks with real Codex CLI, Copilot CLI and opencode
name: Agent integration tests

on:
  pull_request:
  schedule:
    - cron: "17 5 * * 1"   # Mondays

permissions:
  contents: read

concurrency:
  group: agent-integration-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        agent: [codex, copilot-cli, opencode]
        version: ${{ fromJSON(github.event_name == 'pull_request' && '["checked"]' || '["checked", "latest"]') }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Test CyberBoar hooks with the agent
        env:
          AGENT: ${{ matrix.agent }}
          VERSION: ${{ matrix.version }}
        run: |
          args=()
          if [ "$VERSION" = latest ]; then
            case "$AGENT" in
              codex) pkg=@openai/codex ;;
              copilot-cli) pkg=@github/copilot-linux-x64 ;;
              opencode) pkg=opencode-linux-x64 ;;
            esac
            v=$(curl -fsSL "https://registry.npmjs.org/$pkg/latest" | jq -r .version)
            [[ $v =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "unexpected version from npm: $v" >&2; exit 1; }
            echo "latest $pkg: $v"
            args=(--version "$v")
          fi
          "test/e2e/$AGENT.sh" "${args[@]}"
