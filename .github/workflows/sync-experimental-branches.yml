# Open PR from main updates to experimental/* branches
name: Sync experimental branches

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: sync-experimental
  cancel-in-progress: false
  queue: max

jobs:
  sync:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Create GitHub App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RENOVATE_APP_ID || secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_KEY }}
          permission-contents: read
          permission-pull-requests: write
      - name: Open experimental branch sync PRs
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: scripts/sync-experimental-branches.sh
